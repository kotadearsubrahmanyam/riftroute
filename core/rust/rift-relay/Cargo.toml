[package]
name = "rift-relay"
version = "0.1.0"
edition = "2021"
authors = ["RiftRoute Team"]
description = "Controlled Linux & Cross-Platform Relay Service for RiftRoute Network Intelligence"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
sha2 = "0.10"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde"] }
hex = "0.4.3"
rand = "0.10.3"

[dev-dependencies]
tempfile = "3.10"
